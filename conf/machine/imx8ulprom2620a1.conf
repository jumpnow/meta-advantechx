#@TYPE: Machine
#@NAME: i.MX 8ULP EVK
#@SOC: i.MX8ULP
#@DESCRIPTION: Machine configuration for NXP i.MX 8ULP Evaluation Kit with LPDDR4
#@MAINTAINER: Jun Zhu <junzhu@nxp.com>

IMX_DEFAULT_BSP = "nxp"

IMAGE_BOOT_FILES:append = " boot.scr"

require conf/machine/include/adv-imx8ulp-evk.inc

IMX_SOC_REV_UPPER = "A2"
IMAGE_FSTYPES ?= "tar.gz wic.zst"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-advantech"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS = "kernel-devicetree kernel-modules"

# no display
#KERNEL_DEVICETREE_BASENAME ?= "imx8ulp-rom2620-a1"

# dev kit display at 1920x1080 resolution
KERNEL_DEVICETREE_BASENAME ?= "imx8ulp-rom2620-a1-lt9211"

# this default is the same as the -a1-lt9211 dts but with the display
# set to 800x480 resolution which is what we want
#KERNEL_DEVICETREE_BASENAME ?= "imx8ulp-rom2620-a1-lt9211-800x480"

IMX_DEFAULT_BOOTLOADER:imx-nxp-bsp = "u-boot-imx"
UBOOT_SUFFIX:pn-u-boot-imx:mx8-nxp-bsp = "bin"
UBOOT_SUFFIX:pn-u-boot-imx-mfgtool:mx8-nxp-bsp = "bin"
IMX_DEFAULT_UBOOTTOOLS = "u-boot-imx-tools"
PREFERRED_PROVIDER_u-boot-tools-native = "${IMX_DEFAULT_UBOOTTOOLS}-native"
PREFERRED_PROVIDER_nativesdk-u-boot-tools = "nativesdk-${IMX_DEFAULT_UBOOTTOOLS}"
PREFERRED_PROVIDER_u-boot-mkimage-native = "${IMX_DEFAULT_UBOOTTOOLS}-native"
PREFERRED_PROVIDER_nativesdk-u-boot-mkimage = "nativesdk-${IMX_DEFAULT_UBOOTTOOLS}"

QEMUVERSION = "8.2.7"
PREFERRED_VERSION_qemu = "${QEMUVERSION}"
PREFERRED_VERSION_qemu-native = "${QEMUVERSION}"
PREFERRED_VERSION_nativesdk-qemu = "${QEMUVERSION}"

UBOOT_CONFIG_BASENAME = "imx8ulp_rom2620a1"

MACHINE_FEATURES += "soc-reva2"
UPOWER_FIRMWARE_NAME = "upower_a1.bin"

SECO_FIRMWARE_NAME:mx8ulp-generic-bsp = "mx8ulpa2-ahab-container.img"

IMXBOOT_TARGETS_SD:imx8ulp-lpddr4-evk   = "flash_singleboot_m33 flash_singleboot flash_dualboot_m33 flash_dualboot"
IMXBOOT_TARGETS_FSPI:imx8ulp-lpddr4-evk = "flash_singleboot_m33_flexspi flash_dualboot_flexspi"
IMXBOOT_TARGETS_ND:imx8ulp-lpddr4-evk   = "flash_singleboot_m33"
